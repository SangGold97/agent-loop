# Workspace defaults. Goals copy `defaults` at creation and may override them in goal.yaml.
limits:
  max_running_goals: 3        # goals (= meta-work sessions) running at once in this workspace
  max_workers_total: 6        # worker sessions running at once (all goals of this workspace)

defaults:
  meta_work:                  # the session that runs a goal (fixed for every meta-work turn)
    agent: claude             # claude | codex | agy
    model: opus               # models and efforts: Agent CLIs page (follows the installed CLI version)
    effort: high
    autocompact: null         # tokens before auto-compaction (null = CLI default)
    rotate_at_tokens: null    # start a fresh meta-work session when context exceeds this
  meta_advisor:               # consulted by the meta-work through loop advise
    agent: claude
    model: opus
    effort: high
    autocompact: null
  workers:                    # the meta-work picks the CLI per worker; model/effort are fixed here
    claude: {enabled: true, model: opus, effort: high, autocompact: null}
    codex:  {enabled: true, model: gpt-6-astra, effort: high, autocompact: null}
    agy:    {enabled: false, model: gemini-4-argon, effort: high}   # agy has no autocompact setting
  budget:                     # tokens and time are tracked, not limited
    max_concurrent_workers: 3
    max_worker_turns: 40      # spawn + send, over the whole goal
    max_meta_turns: 80        # meta-work + advisor turns
  language: English           # human-facing text: plan, report, chat and advice; worker prompts use English
  base_branch: null           # null = the branch repo/ has checked out when the goal starts; its PR targets it

infra:
  pool_reserve_gb: 3          # host RAM kept out of the pool all sessions share (largest value of all workspaces)
  worker_memory_max_gb: null  # optional hard cap per session on top of the pool (null = pool only)
  vram_reserve_gb: 1          # VRAM kept free on each GPU; below it the newest job on that GPU is stopped

turn_timeout_min: 180
job_timeout_h: 9              # a `loop run` job is stopped after this many hours

guard:
  deny_patterns: []           # extra regexes; matching shell commands are blocked for all agents

mcp_servers: []               # MCP server URLs Claude sessions may use (`claude mcp list`); all others blocked
