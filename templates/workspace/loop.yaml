# Workspace defaults. Missions copy `defaults` at creation and may override them in mission.yaml.
limits:
  max_running_missions: 3     # missions (= meta-work sessions) running at once in this workspace
  max_workers_total: 6        # worker sessions running at once (all missions of this workspace)

defaults:
  meta_work:                  # the session that runs a mission (fixed for every meta-work turn)
    agent: claude             # claude | codex
    model: opus               # models and efforts: Agent CLIs page (follows the installed CLI version)
    effort: high
    autocompact: null         # tokens before auto-compaction (null = CLI default)
    rotate_at_tokens: null    # start a fresh meta-work session when context exceeds this
  workers:                    # the meta-work picks the CLI per worker; model/effort are fixed here
    claude: {enabled: true, model: opus, effort: high, autocompact: null}
    codex:  {enabled: true, model: gpt-6-astra, effort: high, autocompact: null}
  budget:                     # tokens and time are tracked, not limited
    max_concurrent_workers: 3
    max_worker_turns: 40      # spawn + send, over the whole mission
    max_meta_turns: 80
  language: English           # language agents use for plan, journal, report, chat and worker reports
  base_branch: null           # null = the repo's current branch
  push: manual                # manual | branch (push loop/<mission>/integration on accept; never main)

digest:                       # what a finished worker turn sends back to the meta-work
  max_output_words: 500
  max_diff_lines: 80

infra:
  min_free_ram_gb: 2          # refuse to start workers below this
  worker_memory_max_gb: 8     # hard cap per worker (systemd scope)
  gpu_slots: 1

turn_timeout_min: 180

guard:
  deny_patterns: []           # extra regexes; matching shell commands are blocked for all agents
